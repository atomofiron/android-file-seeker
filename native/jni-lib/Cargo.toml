[package]
name = "native-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "native_lib"
crate-type = [
    "cdylib", # for lib.so
    "rlib", # for binary
    #"staticlib", for ios?
]

# brew install protobuf

[dependencies]
jni = "0.21"
users = "0.11"
chrono = "0.4"
prost = "0.14.1"
prost-types = "0.14.1"
libc = "1.0.0-alpha.1"
tree_magic_mini  = { version = "3.2.0", features = ["with-gpl-data"] }

[build-dependencies]
prost-build = "0.14.1"
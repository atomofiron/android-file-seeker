[package]
name = "native-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "native_lib"
crate-type = [
    "cdylib", # for lib.so
    "rlib", # for binary
    #"staticlib", for ios?
]

[[bin]]
name = "uniffi-bindgen"
path = "src/api/bindgen.rs"

[dependencies]
uniffi =  { version = "0.29.4", features = ["cli"] }
users = "0.11"
chrono = "0.4"
fs_extra = "1.3.0"
libc = "1.0.0-alpha.1"
tree_magic_mini  = { version = "3.2.0", features = ["with-gpl-data"] }
bincode = { version = "2.0.1", features = ["derive"] }
lazy_static = "1.5.0"
once_cell = "1.21.3"

[build-dependencies]
uniffi = { version = "0.29.4", features = [ "build" ] }

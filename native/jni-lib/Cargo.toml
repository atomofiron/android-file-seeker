[package]
name = "native-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "native_lib"
crate-type = [
    "cdylib", # for lib.so
    "rlib", # for binary
    #"staticlib", for ios?
]

[dependencies]
uniffi = "0.30.0"
users = "0.11"
chrono = "0.4"
fs_extra = "1.3.0"
libc = "1.0.0-alpha.1"
tree_magic_mini = { version = "3.2.0", features = ["with-gpl-data"] }
bincode = { version = "2.0.1", features = ["derive"] }
once_cell = "1.21.3"
ignore = "0.4.24"
regex = "1.12.2"
num_cpus = "1.17.0"
grep-searcher = "0.1.16"
grep-regex = "0.1.14"
grep-matcher = "0.1.8"
bstr = "1.12.1"
content_inspector = "0.2.4"

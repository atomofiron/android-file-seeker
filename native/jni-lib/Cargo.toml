[package]
name = "native-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "native_lib"
crate-type = [
    "cdylib", # for lib.so
    #"staticlib", for ios?
]

[dependencies]
uniffi = "0.30"
users = "0.11"
chrono = "0.4"
fs_extra = "1.3"
libc = "1.0.0-alpha.1"
tree_magic_mini = { version = "3.2", features = ["with-gpl-data"] }
bincode = { version = "2.0", features = ["derive"] }
once_cell = "1.21"
ignore = "0.4"
regex = "1.12"
num_cpus = "1.17"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
bstr = "1.12"
content_inspector = "0.2"
ctrlc = "3.4"
